# Render Blueprint for Centralized Multi-Service Credentials Vault & Neutral Gateway
# Learn more: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: central-credentials-vault
    runtime: node
    plan: free
    region: oregon # or frankfurt, ohio, singapore
    buildCommand: npm install && npm run build:server
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_ONLY
        value: "true"
      
      # 1. Port Configuration (Render automatically injects PORT)
      - key: PORT
        value: 3000

      # 2. Shared Gateway Secret (Auto-generated by Render)
      - key: CENTRAL_APP_SECRET
        generateValue: true

      # 3. Dynamic CORS Allowed Origins (Whitelist your independent frontend web apps)
      - key: ALLOWED_ORIGINS
        value: "https://dome-2030.web.app,https://dome-2030.firebaseapp.com,http://localhost:5173"

      # 4. Upstream Provider Secrets (Never committed to Git; configured in Render Dashboard)
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

      # 5. Database Connection String (Optional: PostgreSQL, Supabase, Neon, Cloud SQL)
      - key: DATABASE_URL
        sync: false


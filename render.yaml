# Render Blueprint for FastAPI Credentials Vault & Neutral API Gateway
services:
  - type: web
    name: fastapi-credentials-gateway
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      
      # 1. Allowed Frontend Origins (Strict whitelist: only these web apps can call the API)
      - key: ALLOWED_ORIGINS
        value: "https://dome-2030.web.app,https://dome-2030.firebaseapp.com,https://backpack-9e1e0.web.app,https://backpack-9e1e0.firebaseapp.com,https://backpack-edu.com,https://www.backpack-edu.com,https://ai.studio,https://ai.studio/apps/0a30e6e9-d4e8-4021-a7b3-e770d1b39d18,http://localhost:5173,http://localhost:3000,exp://,capacitor://localhost,ionic://localhost,https://localhost,http://localhost,file://,app://"

      # 2. Upstream Provider Secrets (Configured securely in Render Dashboard)
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # 3. Android Play Integrity Config (GCP Credentials + Application ID)
      - key: PLAY_INTEGRITY_PACKAGE_NAME
        value: ""
      - key: PLAY_INTEGRITY_CREDENTIALS_JSON
        value: ""

      # 4. iOS DeviceCheck / App Attest Config (Apple Key credentials)
      - key: APPLE_DEVICECHECK_KEY_ID
        value: ""
      - key: APPLE_DEVICECHECK_TEAM_ID
        value: ""
      - key: APPLE_DEVICECHECK_PRIVATE_KEY
        value: ""

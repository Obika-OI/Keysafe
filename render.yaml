# Render Blueprint for FastAPI Credentials Vault & Neutral API Gateway
services:
  - type: web
    name: fastapi-credentials-gateway
    runtime: python
    plan: free
    region: oregon # or frankfurt, ohio, singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      
      # 1. Allowed Frontend Origins (Strict whitelist: only these web apps can call the API)
      - key: ALLOWED_ORIGINS
        value: "https://dome-2030.web.app,https://dome-2030.firebaseapp.com,http://localhost:5173"

      # 2. Upstream Provider Secrets (Configured securely in Render Dashboard)
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
